stages:
  - dispatch
  - resolve

# --- Dispatcher: poll for @aida mentions ---
aida-dispatch:
  stage: dispatch
  image: public.ecr.aws/docker/library/alpine:3.21
  tags:
    - arch:amd64
    - size:small
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $AIDA_ENABLED == "true"'
      when: always
    - when: never
  script:
    - apk add --no-cache curl jq bash
    - bash .gitlab/scripts/aida-dispatch.sh

# --- Worker: execute command on a single issue or MR ---
aida-resolve:
  stage: resolve
  image: public.ecr.aws/docker/library/node:24-slim
  tags:
    - arch:amd64
    - size:medium
  timeout: 45m
  variables:
    ISSUE_IID: ""
    ISSUE_TITLE: ""
    ISSUE_DESCRIPTION: ""
    AIDA_SOURCE_TYPE: ""
    MR_IID: ""
    MR_TITLE: ""
    MR_DESCRIPTION: ""
    MR_SOURCE_BRANCH: ""
    AIDA_COMMAND: ""
    AIDA_COMMENT_BODY: ""
    AIDA_COMMENT_ID: ""
    CLAUDE_MODEL: "opus"
    # Set AWS_CREDS_TARGET_ROLE as a CI/CD variable, e.g.
    # arn:aws:iam::<account-id>:role/GitLabBedrockAccess
    AWS_CREDS_TARGET_ROLE: ""
    AWS_DEFAULT_REGION: "us-east-1"
    CLAUDE_CODE_USE_BEDROCK: "1"
    ANTHROPIC_DEFAULT_SONNET_MODEL: "us.anthropic.claude-sonnet-4-6"
    GIT_STRATEGY: fetch
    GIT_DEPTH: 0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $ISSUE_IID'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "api" && $MR_IID'
      when: always
    - when: never
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git curl jq ca-certificates && rm -rf /var/lib/apt/lists/*
    - export LC_ALL=C.UTF-8
    - export PATH="$HOME/.local/bin:$PATH"
    - curl -fsSL https://claude.ai/install.sh | bash
    - |
      if [ "${AIDA_DEBUG:-}" = "true" ]; then
        claude --version
        echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:+set} AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION CLAUDE_CODE_USE_BEDROCK=$CLAUDE_CODE_USE_BEDROCK"
        env | grep -i '^AWS_' | sed 's/=.*/=***/' || true
        ls -la ~/.aws/ 2>/dev/null || echo "No ~/.aws/ directory"
        cat ~/.aws/credentials 2>/dev/null | sed 's/=.*/=***/' || echo "No ~/.aws/credentials"
      fi
    - git config user.name "AIDA - AIDLC Development Agent"
    - git config user.email "aida@noreply"
    - git remote set-url origin "https://aida:${GITLAB_TOKEN_AIDA}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - mkdir -p .claude
    - |
      printf '{"attribution":{"commit":"Co-Authored-By: AIDA - AIDLC Developer Agent (%s) <aida@noreply>","pr":""}}\n' "$CLAUDE_MODEL" > .claude/settings.local.json
  script:
    - bash .gitlab/scripts/aida-resolve.sh
  artifacts:
    paths:
      - aida-output.log
    expire_in: 7 days
    when: always
